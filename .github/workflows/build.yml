name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Game version
        required: true
        default: us
        type: choice
        options: [us, jp, eu, sh]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 binutils cmake
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch ROM
        env:
          BASEROM_URL: ${{ secrets.BASEROM_URL }}
        run: |
          if [ -z "$BASEROM_URL" ]; then echo "BASEROM_URL secret is not set"; exit 1; fi
          curl -fsSL "$BASEROM_URL" -o baserom.${{ inputs.version }}.z64
      - name: Build native libraries
        env:
          VERSION: ${{ inputs.version }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./android/build_native.sh
      - name: Build APK
        run: gradle -p android assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sm64-${{ inputs.version }}-android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 3
