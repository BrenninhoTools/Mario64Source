name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Game version
        required: true
        default: us
        type: choice
        options: [us, jp, eu, sh]

env:
  GAME_VERSION: ${{ inputs.version || 'us' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check ROM secret
        id: rom
        env:
          BASEROM_URL: ${{ secrets.BASEROM_URL }}
        run: |
          if [ -z "$BASEROM_URL" ]; then
            echo "::error title=Missing ROM::Create the BASEROM_URL secret (Settings > Secrets and variables > Actions) with a direct download link to baserom.${GAME_VERSION}.z64"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 binutils cmake
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch ROM
        env:
          BASEROM_URL: ${{ secrets.BASEROM_URL }}
        run: curl -fsSL "$BASEROM_URL" -o "baserom.${GAME_VERSION}.z64"
      - name: Build native libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          VERSION="$GAME_VERSION" ./android/build_native.sh
      - name: Build APK
        run: |
          gradle -p android assembleRelease
          cp android/app/build/outputs/apk/release/*.apk "sm64-${GAME_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: sm64-${{ env.GAME_VERSION }}-android
          path: sm64-${{ env.GAME_VERSION }}.apk
          retention-days: 3
