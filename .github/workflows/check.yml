name: Android Source Check

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [us, jp, eu, sh]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 binutils
      - name: Fetch SDL2 headers
        run: git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL android/app/jni/SDL
      - name: Check sources with the NDK
        run: |
          make -f Makefile.port NOEXTRACT=1 PLATFORM=android VERSION=${{ matrix.version }} \
            ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" -j$(nproc) check
